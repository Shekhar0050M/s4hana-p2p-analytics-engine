# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: procureorderapp
type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          url: https://a4796127-12c7-4a21-ae82-e3ced4ab9c3d.abap.us10.hana.ondemand.com
          client: '100'
        app:
          name: Z_PROCURE_UI
          package: Z_P2P_ENGINE
          description: UI for Procure Order Management
          transport: ''
        exclude:
          - /test/
          - /localService/
